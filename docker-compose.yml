services:
  postgres:
    image: postgres:16
    container_name: maggybox-postgres
    environment:
      POSTGRES_USER: maggybox
      POSTGRES_PASSWORD: maggybox
      POSTGRES_DB: maggybox
    ports:
      - "5432:5432"
    volumes:
      - maggybox-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maggybox -d maggybox"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  maggybox-pg:
